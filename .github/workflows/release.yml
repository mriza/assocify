name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release binary
        run: cargo build --release

      - name: Compress binary
        run: tar -czvf assocify-linux-x86_64.tar.gz -C target/release assocify

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          files: assocify-linux-x86_64.tar.gz
          tag_name: latest
          name: "Latest Release"
          body: "Automatic build from latest commit."
          draft: false
          prerelease: false
